<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
  <title>SMART@Home Clinician View</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="widgets/trend-line.css" />
  <link rel="stylesheet" href="widgets/kpi-tiles.css" />
  <link rel="stylesheet" href="widgets/scatter.css" />
  <link rel="stylesheet" href="widgets/body-diagram.css" />
  <link rel="stylesheet" href="widgets/lungs-gauge.css" />
  <link rel="stylesheet" href="widgets/adherence-heatmap.css" />
  <link rel="stylesheet" href="widgets/trigger-bubbles.css" />
  <link rel="stylesheet" href="widgets/night-moon.css" />
  <link rel="stylesheet" href="widgets/change-ticker.css" />
  <link rel="stylesheet" href="widgets/air-quality.css" />
  <link rel="stylesheet" href="widgets/survey-widgets.css" />
</head>
<body>
  <header class="app-header">
    <button id="tray-toggle" class="tray-toggle" type="button" aria-label="Open widget tray" aria-expanded="false" aria-controls="tray-drawer">☰</button>
    <div class="patient-picker">
      <button id="patient-button" class="patient-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="patient-menu" disabled>
        <span class="patient-text"><strong id="patient-name">Loading…</strong></span>
        <span class="patient-chevron" aria-hidden="true">▾</span>
      </button>
      <ul id="patient-menu" class="patient-menu" role="listbox" aria-label="Patients" hidden></ul>
    </div>
  </header>
  <main id="app">
    <div id="page-fly" class="page" data-page="fly" role="region" aria-label="Fly" hidden></div>
    <div id="page-anomalies" class="page" data-page="anomalies" role="region" aria-label="Anomalies" hidden></div>
    <div id="page-data" class="page is-active" data-page="data" role="region" aria-label="Data">
    <div class="workspace">
      <section class="canvas-panel" aria-labelledby="canvas-heading">
        <div class="canvas-toolbar"><h2 id="canvas-heading">Your patient view</h2><span id="save-status" role="status" aria-live="polite">Loading workspace…</span><button id="retry-save" hidden>Retry save</button></div>
        <p id="canvas-help" class="muted">Drop on a card to insert before it. Drop below to place at the end.</p>
        <div id="canvas" class="canvas-grid" aria-describedby="canvas-help"></div>
      </section>
    </div>
    </div>
  </main>
  <nav id="dock" class="dock" aria-label="Pages">
    <span class="dock-indicator" aria-hidden="true"></span>
    <button type="button" class="dock-item" data-page="fly" aria-controls="page-fly">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 3 10.5l7 2.5 2.5 7z"/><path d="m10 13 4-4"/></svg>
      <span>Fly</span>
    </button>
    <button type="button" class="dock-item" data-page="anomalies" aria-controls="page-anomalies">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.3v.2"/></svg>
      <span>Anomalies</span>
    </button>
    <button type="button" class="dock-item is-active" data-page="data" aria-controls="page-data" aria-current="page">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></svg>
      <span>Data</span>
    </button>
  </nav>
  <div id="tray-scrim" class="tray-scrim" hidden></div>
  <aside id="tray-drawer" class="palette-panel" aria-labelledby="palette-heading" aria-hidden="true">
    <button id="tray-close" class="tray-close" type="button" aria-label="Close widget tray">×</button>
    <p class="eyebrow">MAKE IT YOURS</p><h2 id="palette-heading">Widget tray</h2>
    <p class="muted">Drag a widget into your view, or select Add.</p>
    <div id="palette"></div>
    <p class="tray-note">Move cards by their handles. Choose S, M or L to change their size.</p>
  </aside>
  <div id="card-modal" class="card-modal" hidden>
    <div class="card-modal-backdrop" id="card-modal-backdrop"></div>
    <article id="card-modal-dialog" class="card-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
      <div class="card-modal-head"><h2 id="card-modal-title"></h2><button id="card-modal-close" class="card-modal-close" type="button" aria-label="Close enlarged view">×</button></div>
      <div id="card-modal-body" class="widget-body"></div>
    </article>
  </div>
  <script src="widgets/registry.js"></script>
  <script src="widgets/hello.js"></script>
  <script src="lib/svg.js"></script>
  <script src="widgets/trend-line.js"></script>
  <script src="widgets/kpi-tiles.js"></script>
  <script src="widgets/scatter.js"></script>
  <script src="widgets/body-diagram.js"></script>
  <script src="widgets/lungs-gauge.js"></script>
  <script src="widgets/adherence-heatmap.js"></script>
  <script src="widgets/trigger-bubbles.js"></script>
  <script src="widgets/night-moon.js"></script>
  <script src="widgets/change-ticker.js"></script>
  <script src="widgets/air-quality.js"></script>
  <script src="widgets/survey-widgets.js"></script>
  <!-- Register additional widget scripts here, before canvas startup. -->
  <script src="canvas.js"></script>
  <script src="renderer.js"></script>
  <script src="nav.js"></script>
</body>
</html>
